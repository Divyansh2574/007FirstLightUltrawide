name: Lint

# Runs clang-format and clang-tidy on C++ changes via cpp-linter. clang-tidy
# needs a compile_commands.json, so we configure with MSVC first (the code is
# Windows-only - windows.h must be parseable, which rules out a Linux runner).

on:
  pull_request:
    paths: &cpp_paths
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '.clang-tidy'
      - '.clang-format'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-linter.yml'
  push:
    branches: [ main ]
    paths: *cpp_paths

permissions:
  contents: read
  pull-requests: write   # post review comments on PRs

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sets INCLUDE/LIB/PATH (persisted to later steps) so clang-tidy can find
      # windows.h via the MSVC compile commands.
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate compile_commands.json
        run: cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file            # clang-format: use .clang-format
          tidy-checks: ''        # clang-tidy: use .clang-tidy
          database: build        # compile_commands.json location
          files-changed-only: ${{ github.event_name == 'pull_request' }}
          thread-comments: ${{ github.event_name == 'pull_request' }}
          step-summary: true
          ignore: build|cmake-build-*

      - name: Fail if lint problems were found
        if: steps.linter.outputs.checks-failed > 0
        run: |
          Write-Output "::error::cpp-linter found ${{ steps.linter.outputs.checks-failed }} issue(s)."
          exit 1
