name: Release

# Publishes a GitHub Release with an MSVC x64 build of the .asi. A release is
# cut two ways:
#   * Push to main      -> the next version is derived from Conventional Commits
#                          (fix->patch, feat->minor, feat!/BREAKING->major;
#                          anything else publishes nothing). Needs a prior
#                          version tag as the baseline to analyse against.
#   * Push a vX.Y.Z tag -> that exact version is built and released. Use this to
#                          seed the first release or force a specific version.

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:   # allow manual runs from the Actions tab

# Needed to create tags and publish releases with the default GITHUB_TOKEN.
permissions:
  contents: write

# Never let two releases race; queue them so version numbers stay monotonic.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for version calculation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Branch/manual runs: compute the next version from the commit history.
      # dry_run = compute only; the tag is created at the publish step so a
      # failed build never leaves an orphan tag. Skipped for tag pushes.
      - name: Compute version from commits
        id: semver
        if: github.ref_type == 'branch'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: false

      # Resolve the tag/version from whichever source applies. An empty version
      # means "nothing to release" and gates every step below.
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace '^v', ''
          } else {
            $tag = '${{ steps.semver.outputs.new_tag }}'
            $version = '${{ steps.semver.outputs.new_version }}'
          }
          "tag=$tag"         | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          if ($version) { Write-Output "Releasing $tag (version $version)" }
          else { Write-Output "No releasable commits since the last tag - skipping." }

      - name: Set up MSVC (x64)
        if: steps.ver.outputs.version != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        if: steps.ver.outputs.version != ''
        # Quote the -D token: pwsh otherwise mangles the bare "=1.0.0" to "1".
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DPROJECT_VERSION=${{ steps.ver.outputs.version }}"

      - name: Build
        if: steps.ver.outputs.version != ''
        run: cmake --build build --config Release

      - name: Package
        if: steps.ver.outputs.version != ''
        id: pkg
        shell: pwsh
        run: |
          $ver   = '${{ steps.ver.outputs.version }}'
          $stage = "007FirstLightUltrawide-v$ver"
          New-Item -ItemType Directory -Force $stage | Out-Null
          # Locate the artifacts regardless of single/multi-config layout.
          $asi = Get-ChildItem build -Recurse -Filter 007FirstLightUltrawide.asi | Select-Object -First 1
          $ini = Get-ChildItem build -Recurse -Filter 007FirstLightUltrawide.ini | Select-Object -First 1
          if (-not $asi) { throw "Build output .asi not found" }
          Copy-Item $asi.FullName $stage
          if ($ini) { Copy-Item $ini.FullName $stage }
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force
          "asset=$stage.zip" | Out-File $env:GITHUB_OUTPUT -Append

      # Build categorized release notes from the Conventional Commits in range.
      # Tag pushes describe the just-pushed tag (--latest); branch/manual runs
      # describe the commits since the last tag, labelled with the new version.
      - name: Generate release notes
        if: steps.ver.outputs.version != ''
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ github.ref_type == 'tag' && '--latest' || format('--unreleased --tag {0}', steps.ver.outputs.tag) }}

      - name: Publish release
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.content }}
          files: ${{ steps.pkg.outputs.asset }}
